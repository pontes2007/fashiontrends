<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>
        <link rel="stylesheet" href="../global.css">
        <link rel="stylesheet" href="cadastro.css">
    </head>
    <body>
        <div class="maincontainer">
            <div class="cadastrocontainer">
                <label class="cadastrotext">Cadastrar</label>
                <div class="inputcontainer">
                    <img class="imageuser" src="../imagensdosprodutos/user.png" alt="">
                    <input type="email" placeholder="E-mail">
                </div>
                <div class="inputcontainer">
                    <img class="imageuser" src="../imagensdosprodutos/lock.png" alt="">
                    <input type="password" placeholder="Senha">
                </div>
                <div id="verificationtext"></div>
                <button class="sendbutton">Entrar</button>
            </div>
        </div>
        <script src="cadastro.js"></script>
    </body>
</html>
